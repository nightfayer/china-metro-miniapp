<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>ChinaMetro · Трекер маршрута</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0b1220;
      --card: #162033;
      --card-soft: rgba(22, 32, 51, 0.72);
      --border: #28354d;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --btn-bg: #26334a;
      --pill-text: #0f172a;
      --zh: #cbd5e1;
      --shadow: 0 12px 28px rgba(0, 0, 0, .38);
    }
    body.light {
      --bg: #f1f5f9;
      --card: #ffffff;
      --card-soft: #ffffff;
      --border: #cbd5e1;
      --text: #0f172a;
      --muted: #475569;
      --accent: #0284c7;
      --btn-bg: #e2e8f0;
      --zh: #334155;
      --shadow: 0 8px 20px rgba(15, 23, 42, .10);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 12px 12px 32px;
      font-size: 14px;
      line-height: 1.4;
      transition: background .2s, color .2s;
    }
    .header {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 14px;
      position: sticky;
      top: 8px;
      z-index: 10;
      box-shadow: var(--shadow);
    }
    .top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .title { font-size: 16px; font-weight: 800; color: var(--accent); margin-bottom: 3px; }
    .theme-btn {
      flex: none;
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 14px;
      background: var(--btn-bg);
      color: var(--text);
    }
    .meta { font-size: 12.5px; color: var(--muted); }
    .alert-banner {
      display: none;
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 700;
      background: rgba(250, 204, 21, 0.18);
      color: #facc15;
      border: 1px solid rgba(250, 204, 21, 0.35);
    }
    body.light .alert-banner { background: #fef9c3; color: #854d0e; border-color: #fde047; }

    .progress-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 12px; color: var(--muted); font-weight: 600; }
    .bar { height: 7px; background: var(--btn-bg); border-radius: 99px; margin-top: 6px; overflow: hidden; }
    .fill { height: 100%; width: 0%; background: linear-gradient(90deg, #38bdf8, #22c55e); transition: width .25s ease; }

    .controls { display: flex; gap: 8px; margin-top: 12px; }
    button {
      border: 0;
      border-radius: 11px;
      padding: 11px 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      background: var(--btn-bg);
      color: var(--text);
      transition: transform .1s, opacity .15s;
    }
    button:active { transform: scale(0.96); }
    button.primary { flex: 1.5; background: #0284c7; color: #ffffff; }
    button.secondary { flex: 1; }
    button.icon { flex: 0 0 auto; padding: 11px 14px; }

    .segment {
      background: var(--card-soft);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }
    .seg-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .pill {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 800;
      color: var(--pill-text);
    }
    .dir { font-size: 12px; color: var(--muted); font-weight: 500; }

    .station {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 11px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: background .15s, opacity .15s;
    }
    .station:hover { background: rgba(56, 189, 248, 0.08); }
    .station.cur { background: rgba(56, 189, 248, 0.16); border-left-color: var(--accent); }
    .station.done { opacity: 0.42; }
    .station.done .st-ru { text-decoration: line-through; }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex: none;
      border: 2px solid var(--text);
    }
    .station.cur .dot {
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.35);
      transform: scale(1.18);
    }
    .st-names { flex: 1; min-width: 0; }
    .st-ru { font-weight: 700; font-size: 14px; }
    .st-en { font-size: 12px; color: var(--muted); }
    .st-zh { font-size: 13px; color: var(--zh); font-weight: 700; text-align: right; white-space: nowrap; }

    .badge {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 6px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 800;
      vertical-align: middle;
    }
    .badge-exit { background: rgba(250, 204, 21, 0.22); color: #fde047; }
    body.light .badge-exit { background: #fef08a; color: #854d0e; }
    .badge-tr { background: rgba(56, 189, 248, 0.22); color: #38bdf8; }
    body.light .badge-tr { background: #e0f2fe; color: #0369a1; }

    .local-card {
      display: none;
      background: #ffffff;
      color: #0f172a;
      border-radius: 22px;
      padding: 32px 18px;
      text-align: center;
      margin-top: 8px;
      box-shadow: 0 14px 32px rgba(0,0,0,.4);
      border: 3px solid #0f172a;
    }
    .local-ask { color: #64748b; font-size: 17px; margin-bottom: 16px; }
    .local-zh { color: #dc2626; font-size: 46px; font-weight: 900; line-height: 1.2; margin: 14px 0; }
    .local-py { color: #64748b; font-size: 16px; margin-top: 14px; }
    .local-ru { font-size: 18px; font-weight: 700; margin: 6px 0 24px; }
    .back-btn { width: 100%; background: #0f172a; color: #fff; padding: 14px; font-size: 15px; }
  </style>
</head>
<body>

<div id="view-route">
  <div class="header">
    <div class="top-row">
      <div>
        <div class="title" id="h-title">Загрузка маршрута...</div>
        <div class="meta" id="h-meta"></div>
      </div>
      <button class="theme-btn" id="theme-btn" onclick="toggleTheme()" title="Светлая / тёмная тема">☀️</button>
    </div>
    <div class="alert-banner" id="alert-banner"></div>
    <div class="progress-row">
      <span id="p-label">Тапайте на станции по ходу поездки</span>
      <span id="p-count">0 / 0</span>
    </div>
    <div class="bar"><div class="fill" id="p-fill"></div></div>
    <div class="controls">
      <button class="icon" onclick="step(-1)" title="Предыдущая">◀</button>
      <button class="primary" onclick="step(1)">▶ Следующая станция</button>
      <button class="secondary" onclick="showLocal(true)">🗣 Местному</button>
    </div>
  </div>
  <div id="segments"></div>
</div>

<div class="local-card" id="view-local">
  <div class="local-ask">请问，怎么去这个地铁站？</div>
  <div class="local-zh" id="l-zh"></div>
  <hr style="border:0;border-top:2px solid #e2e8f0;margin:18px 20px;">
  <div class="local-py" id="l-py"></div>
  <div class="local-ru" id="l-ru"></div>
  <button class="back-btn" onclick="showLocal(false)">◀ Назад к маршруту</button>
</div>

<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
  }

  function applySavedTheme() {
    const saved = localStorage.getItem("cm_theme");
    const isLight = saved ? saved === "light" : (tg && tg.colorScheme === "light");
    document.body.classList.toggle("light", !!isLight);
    document.getElementById("theme-btn").textContent = isLight ? "🌙" : "☀️";
  }
  function toggleTheme() {
    const isLight = !document.body.classList.contains("light");
    document.body.classList.toggle("light", isLight);
    localStorage.setItem("cm_theme", isLight ? "light" : "dark");
    document.getElementById("theme-btn").textContent = isLight ? "🌙" : "☀️";
  }
  applySavedTheme();

  function decodeBase64UrlJson(b64u) {
    const b64 = b64u.replace(/-/g, '+').replace(/_/g, '/');
    const pad = b64.length % 4 ? '='.repeat(4 - (b64.length % 4)) : '';
    const bin = atob(b64 + pad);
    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    const jsonStr = new TextDecoder('utf-8').decode(bytes);
    return JSON.parse(jsonStr);
  }

  const DEMO_DATA = {
    t: "Шанхай · Аэропорт Пудун → Вайтань",
    m: "~58 мин · 18 ост. · ~7 ¥ (~86 ₽)",
    ez: "南京东路",
    er: "Восточная Нанкинская ул. (Вайтань)",
    ep: "nán jīng dōng lù",
    g: [
      {
        l: "Линия 2",
        c: "#97D700",
        d: "Line 2 → East Xujing (往 徐泾东)",
        s: [
          { r: "Аэропорт Пудун", e: "Pudong Airport", z: "浦东1号2号航站楼" },
          { r: "Лунъян Лу", e: "Longyang Road", z: "龙阳路" },
          { r: "Век Парк", e: "Century Park", z: "世纪公园" },
          { r: "Луцзяцзуй", e: "Lujiazui", z: "陆家嘴", x: 1 },
          { r: "Вост. Нанкинская (Вайтань)", e: "East Nanjing Road", z: "南京东路" }
        ]
      }
    ]
  };

  let data = DEMO_DATA;
  try {
    const hash = window.location.hash || "";
    const match = hash.match(/d=([^&]+)/);
    if (match && match[1]) {
      data = decodeBase64UrlJson(match[1]);
    }
  } catch (e) {
    console.error("Failed to parse route payload:", e);
  }

  document.getElementById("h-title").textContent = data.t || "Маршрут";
  document.getElementById("h-meta").textContent = data.m || "";
  document.getElementById("l-zh").textContent = data.ez || "";
  document.getElementById("l-py").textContent = data.ep || "";
  document.getElementById("l-ru").textContent = data.er || "";

  const segContainer = document.getElementById("segments");
  const stationEls = [];
  const totalSegs = (data.g || []).length;

  (data.g || []).forEach((seg, segIdx) => {
    const segDiv = document.createElement("div");
    segDiv.className = "segment";

    const head = document.createElement("div");
    head.className = "seg-head";
    head.innerHTML = `<span class="pill" style="background:${seg.c || '#38bdf8'}">${seg.l}</span><span class="dir">${seg.d || ''}</span>`;
    segDiv.appendChild(head);

    (seg.s || []).forEach((st, idxInSeg) => {
      const el = document.createElement("div");
      const globalIdx = stationEls.length;
      const isTransferStart = segIdx > 0 && idxInSeg === 0;
      stationEls.push({ el, st, seg, isTransferStart });
      el.className = "station";
      el.onclick = () => {
        curIdx = globalIdx;
        if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
        renderProgress();
      };

      let badges = "";
      if (isTransferStart) badges += `<span class="badge badge-tr">пересадка</span>`;
      if (st.x) badges += `<span class="badge badge-exit">выход после неё</span>`;

      el.innerHTML = `
        <span class="dot" style="background:${seg.c || '#38bdf8'}"></span>
        <div class="st-names">
          <div class="st-ru">${st.r}${badges}</div>
          ${st.e ? `<div class="st-en">${st.e}</div>` : ""}
        </div>
        <div class="st-zh">${st.z || ""}</div>
      `;
      segDiv.appendChild(el);
    });

    segContainer.appendChild(segDiv);
  });

  let curIdx = 0;
  function renderProgress() {
    const total = stationEls.length;
    stationEls.forEach((item, i) => {
      item.el.classList.toggle("done", i < curIdx);
      item.el.classList.toggle("cur", i === curIdx);
    });
    const pct = total > 1 ? (curIdx / (total - 1)) * 100 : 100;
    document.getElementById("p-fill").style.width = pct + "%";
    document.getElementById("p-count").textContent = `${curIdx + 1} / ${total}`;

    const banner = document.getElementById("alert-banner");
    const curItem = stationEls[curIdx];
    if (curItem) {
      const curSt = curItem.st;
      document.getElementById("p-label").textContent =
        curIdx === total - 1 ? "🏁 Вы на конечной станции!" : `Сейчас: ${curSt.r}`;

      if (curIdx === total - 1) {
        banner.style.display = "block";
        banner.textContent = `🏁 Выходите на станции ${curSt.r} (${curSt.z})!`;
      } else if (curSt.x) {
        banner.style.display = "block";
        banner.textContent = "🔔 Приготовьтесь! На следующей станции выходим.";
      } else if (curItem.isTransferStart) {
        banner.style.display = "block";
        banner.textContent = `🔄 Пересадка на ${curItem.seg.l} (${curItem.seg.d})`;
      } else {
        banner.style.display = "none";
      }
    }
  }

  function step(delta) {
    const next = curIdx + delta;
    if (next >= 0 && next < stationEls.length) {
      curIdx = next;
      if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
      renderProgress();
      stationEls[curIdx].el.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
  }

  function showLocal(flag) {
    document.getElementById("view-route").style.display = flag ? "none" : "block";
    document.getElementById("view-local").style.display = flag ? "block" : "none";
  }

  renderProgress();
</script>
</body>
</html>
