<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>ChinaMetro</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0a0a0b;
      --surface: #141416;
      --surface-elevated: #1c1c1f;
      --border: #26262a;
      --text: #fafafa;
      --text-secondary: #8e8e93;
      --text-tertiary: #636366;
      --btn-secondary: #222226;
      --dock-bg: rgba(20, 20, 22, 0.88);
      --warn-bg: rgba(245, 158, 11, 0.14);
      --warn-border: rgba(245, 158, 11, 0.32);
      --warn-text: #fbbf24;
      --dot-border: #0a0a0b;
    }
    body.light {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --surface-elevated: #f0f0f3;
      --border: #e5e5ea;
      --text: #111113;
      --text-secondary: #6e6e73;
      --text-tertiary: #8e8e93;
      --btn-secondary: #e8e8ed;
      --dock-bg: rgba(255, 255, 255, 0.90);
      --warn-bg: #fef3c7;
      --warn-border: #fcd34d;
      --warn-text: #92400e;
      --dot-border: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 12px 14px 104px;
      font-size: 14px;
      line-height: 1.38;
      font-variant-numeric: tabular-nums;
      transition: background .2s ease, color .2s ease;
    }

    /* Summary Header */
    .summary {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }
    .summary-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .city-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }
    .top-actions { display: flex; gap: 6px; align-items: center; }
    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .icon-btn.hidden { display: none; }
    .route-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.25;
      margin-bottom: 8px;
    }
    .metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 12.5px;
      color: var(--text-secondary);
      padding-bottom: 11px;
      border-bottom: 1px solid var(--border);
    }
    .metrics strong { color: var(--text); font-weight: 600; }

    .progress-wrap { margin-top: 10px; }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 6px;
      gap: 8px;
    }
    .progress-meta strong { color: var(--text); font-weight: 600; }
    .progress-track {
      height: 4px;
      background: var(--surface-elevated);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--text);
      border-radius: 99px;
      transition: width .25s cubic-bezier(.22,1,.36,1);
    }

    .notice {
      display: none;
      margin-top: 10px;
      padding: 9px 11px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 600;
      background: var(--warn-bg);
      border: 1px solid var(--warn-border);
      color: var(--warn-text);
    }

    /* Transit Timeline */
    .segment {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 13px 14px 10px;
      margin-bottom: 8px;
    }
    .segment.collapsed { padding-bottom: 13px; }
    .segment.collapsed .seg-body { display: none; }
    .seg-header {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }
    .segment:not(.collapsed) .seg-header { margin-bottom: 12px; }
    .line-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 24px;
      padding: 0 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 800;
      color: #0a0a0b;
      flex: none;
    }
    .seg-dir {
      flex: 1;
      font-size: 12.5px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .seg-meta {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-tertiary);
      white-space: nowrap;
      flex: none;
    }
    .station-row.mid-hidden { display: none; }
    .mid-expand {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 6px 8px 10px 6px;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 12.5px;
      font-weight: 600;
    }
    .mid-expand-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-tertiary);
      margin: 4px auto;
    }
    .seg-chev {
      color: var(--text-tertiary);
      transition: transform .2s ease;
      flex: none;
    }
    .segment.collapsed .seg-chev { transform: rotate(-90deg); }

    .station-row {
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 7px 8px 11px 6px;
      border-radius: 10px;
      cursor: pointer;
      transition: background .15s, opacity .15s;
    }
    .station-row:active { background: var(--surface-elevated); }
    .station-row.cur { background: var(--surface-elevated); }
    .station-row.done { opacity: 0.38; }
    .station-row.done .st-ru { text-decoration: line-through; }

    /* Continuous Vertical Spine */
    .rail-col {
      position: relative;
      width: 18px;
      display: flex;
      justify-content: center;
      align-self: stretch;
      flex: none;
    }
    .rail-line {
      position: absolute;
      top: 14px;
      bottom: -18px;
      width: 4px;
      border-radius: 2px;
    }
    .station-row:last-child .rail-line { display: none; }

    .rail-dot {
      position: relative;
      z-index: 2;
      margin-top: 3px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--surface);
      border: 3px solid var(--line-color, #888);
      transition: transform .15s;
    }
    .station-row.major .rail-dot {
      width: 16px;
      height: 16px;
      margin-top: 1px;
      background: var(--line-color, #888);
      border: 3px solid var(--dot-border);
      box-shadow: 0 0 0 1.5px var(--line-color, #888);
    }
    .station-row.cur .rail-dot {
      transform: scale(1.22);
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.18);
    }
    body.light .station-row.cur .rail-dot {
      box-shadow: 0 0 0 4px rgba(17, 17, 19, 0.14);
    }

    .st-main { flex: 1; min-width: 0; }
    .st-ru { font-size: 14.5px; font-weight: 600; color: var(--text); line-height: 1.25; }
    .st-en { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
    .st-zh {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      text-align: right;
      white-space: nowrap;
      padding-top: 1px;
    }

    .tag {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 6px;
      border-radius: 5px;
      font-size: 10.5px;
      font-weight: 700;
      vertical-align: middle;
      background: var(--warn-bg);
      color: var(--warn-text);
    }

    /* Transfer Connector */
    .transfer-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 20px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .transfer-dots {
      width: 16px;
      height: 18px;
      border-left: 2px dashed var(--text-tertiary);
      margin-left: 7px;
    }

    /* Exit Tip & Amap Card */
    .exit-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      margin-top: 10px;
    }
    .exit-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .exit-tip { font-size: 13.5px; color: var(--text); line-height: 1.45; margin-bottom: 12px; }
    .amap-btn {
      width: 100%;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-elevated);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
    }

    /* Floating Bottom Dock */
    .dock {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: max(12px, env(safe-area-inset-bottom));
      background: var(--dock-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 8px;
      display: flex;
      gap: 8px;
      z-index: 20;
      box-shadow: 0 12px 32px rgba(0, 0, 0, .35);
    }
    .dock button {
      border: 0;
      border-radius: 11px;
      height: 42px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform .1s ease, opacity .15s;
    }
    .dock button:active { transform: scale(0.97); }
    .btn-prev { width: 46px; flex: none; background: var(--btn-secondary); color: var(--text); }
    .btn-next { flex: 1.5; background: var(--text); color: var(--bg); font-weight: 700; }
    .btn-local { flex: 1; background: var(--btn-secondary); color: var(--text); }

    /* Show-to-Local Fullscreen Card */
    .local-view {
      display: none;
      background: #ffffff;
      color: #111113;
      border-radius: 20px;
      overflow: hidden;
      padding: 0 18px 22px;
      text-align: center;
      border: 1px solid #e5e5ea;
      box-shadow: 0 16px 40px rgba(0, 0, 0, .25);
    }
    .local-strip {
      height: 10px;
      margin: 0 -18px 18px;
      background: #111113;
    }
    .local-line-pill {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 14px;
    }
    .seg-switch {
      display: flex;
      background: #f0f0f3;
      border-radius: 10px;
      padding: 3px;
      margin-bottom: 22px;
    }
    .seg-switch button {
      flex: 1;
      height: 34px;
      border: 0;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      background: transparent;
      color: #6e6e73;
    }
    .seg-switch button.active {
      background: #ffffff;
      color: #111113;
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
    }
    .local-ask { font-size: 16px; color: #6e6e73; margin-bottom: 14px; }
    .local-zh { font-size: 44px; font-weight: 800; color: #dc2626; line-height: 1.15; letter-spacing: 0.02em; margin: 10px 0; }
    .local-div { height: 1px; background: #e5e5ea; margin: 20px 12px; }
    .local-py { font-size: 15px; color: #6e6e73; }
    .local-ru { font-size: 17.5px; font-weight: 700; color: #111113; margin: 6px 0 22px; }
    .local-actions { display: flex; gap: 8px; }
    .local-copy {
      flex: 1;
      height: 46px;
      border: 1px solid #d1d1d6;
      border-radius: 12px;
      background: #f5f5f7;
      color: #111113;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .local-back {
      flex: 1.2;
      height: 46px;
      border: 0;
      border-radius: 12px;
      background: #111113;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="view-route">
  <div class="summary">
    <div class="summary-top">
      <div class="city-label" id="h-city">Маршрут</div>
      <div class="top-actions">
        <button class="icon-btn hidden" id="reset-btn" onclick="resetProgress()" aria-label="Сбросить прогресс" title="Начать заново">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        </button>
        <button class="icon-btn" id="theme-btn" onclick="toggleTheme()" aria-label="Сменить тему"></button>
      </div>
    </div>
    <div class="route-title" id="h-title">Загрузка...</div>
    <div class="metrics" id="h-metrics"></div>
    <div class="progress-wrap">
      <div class="progress-meta">
        <span id="p-label">Тапайте на станции по ходу поездки</span>
        <span id="p-rem"></span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="p-fill"></div></div>
    </div>
    <div class="notice" id="notice"></div>
  </div>

  <div id="segments"></div>

  <div class="exit-card" id="exit-card" style="display:none;">
    <div class="exit-title">Выход из метро и карта</div>
    <div class="exit-tip" id="exit-tip" style="display:none;"></div>
    <a class="amap-btn" id="amap-link" href="#" target="_blank" style="display:none;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg>
      <span>Открыть выход в Amap</span>
    </a>
  </div>

  <div class="dock">
    <button class="btn-prev" onclick="step(-1)" aria-label="Предыдущая станция">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button class="btn-next" onclick="step(1)">
      <span>Следующая</span>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    <button class="btn-local" onclick="showLocal(true)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span>Местному</span>
    </button>
  </div>
</div>

<div class="local-view" id="view-local">
  <div class="local-strip" id="local-strip"></div>
  <div class="seg-switch">
    <button id="sw-end" class="active" onclick="setLocalMode('end')">Конечная</button>
    <button id="sw-cur" onclick="setLocalMode('cur')">Текущая станция</button>
  </div>
  <div class="local-line-pill" id="l-line"></div>
  <div class="local-ask">请问，怎么去这个地铁站？</div>
  <div class="local-zh" id="l-zh"></div>
  <div class="local-div"></div>
  <div class="local-py" id="l-py"></div>
  <div class="local-ru" id="l-ru"></div>
  <div class="local-actions">
    <button class="local-copy" id="copy-btn" onclick="copyZh()">Скопировать</button>
    <button class="local-back" onclick="showLocal(false)">К маршруту</button>
  </div>
</div>

<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  const SUN_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
  const MOON_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';

  function applyTheme() {
    const saved = localStorage.getItem("cm_theme");
    const isLight = saved ? saved === "light" : (tg && tg.colorScheme === "light");
    document.body.classList.toggle("light", !!isLight);
    document.getElementById("theme-btn").innerHTML = isLight ? MOON_SVG : SUN_SVG;
  }
  function toggleTheme() {
    const isLight = !document.body.classList.contains("light");
    document.body.classList.toggle("light", isLight);
    localStorage.setItem("cm_theme", isLight ? "light" : "dark");
    document.getElementById("theme-btn").innerHTML = isLight ? MOON_SVG : SUN_SVG;
  }
  applyTheme();

  function decodeBase64UrlJson(b64u) {
    const b64 = b64u.replace(/-/g, '+').replace(/_/g, '/');
    const pad = b64.length % 4 ? '='.repeat(4 - (b64.length % 4)) : '';
    const bin = atob(b64 + pad);
    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    return JSON.parse(new TextDecoder('utf-8').decode(bytes));
  }

  function contrastText(hex) {
    const c = (hex || "#38bdf8").replace("#", "");
    if (c.length !== 6) return "#0a0a0b";
    const r = parseInt(c.slice(0,2), 16), g = parseInt(c.slice(2,4), 16), b = parseInt(c.slice(4,6), 16);
    const luma = 0.299 * r + 0.587 * g + 0.114 * b;
    return luma < 125 ? "#ffffff" : "#0a0a0b";
  }

  const DEMO_DATA = {
    t: "Шанхай · Аэропорт Пудун → Вайтань",
    m: "~58 мин · 18 ост. · ~7 ¥ (~86 ₽)",
    tm: 58,
    ez: "南京东路",
    er: "Восточная Нанкинская ул. (Вайтань)",
    ep: "nán jīng dōng lù",
    tip: "Выход 2 или 7 — ~7–10 мин пешком прямо до набережной Вайтань.",
    lat: 31.2381,
    lon: 121.4846,
    amap: "https://uri.amap.com/marker?position=121.4846,31.2381&name=%E5%8D%97%E4%BA%AC%E4%B8%9C%E8%B7%AF&src=chinametro&callnative=1",
    g: [
      {
        l: "Линия 2",
        c: "#97D700",
        d: "Line 2 → East Xujing (往 徐泾东)",
        s: [
          { r: "Аэропорт Пудун", e: "Pudong Airport", z: "浦东1号2号航站楼" },
          { r: "Лунъян Лу", e: "Longyang Road", z: "龙阳路" },
          { r: "Век Парк", e: "Century Park", z: "世纪公园" },
          { r: "Луцзяцзуй", e: "Lujiazui", z: "陆家嘴", x: 1 },
          { r: "Вост. Нанкинская (Вайтань)", e: "East Nanjing Road", z: "南京东路" }
        ]
      }
    ]
  };

  let data = DEMO_DATA;
  try {
    const m = (window.location.hash || "").match(/d=([^&]+)/);
    if (m && m[1]) data = decodeBase64UrlJson(m[1]);
  } catch (e) { console.error(e); }

  const titleParts = (data.t || "").split(" · ");
  if (titleParts.length > 1) {
    document.getElementById("h-city").textContent = titleParts[0];
    document.getElementById("h-title").textContent = titleParts.slice(1).join(" · ");
  } else {
    document.getElementById("h-title").textContent = data.t || "Маршрут";
  }

  const metricsHtml = (data.m || "")
    .split("·")
    .map(p => p.trim())
    .filter(Boolean)
    .map(p => `<span><strong>${p}</strong></span>`)
    .join("");
  document.getElementById("h-metrics").innerHTML = metricsHtml;

  // Exit tip & Amap button
  if (data.tip || data.amap) {
    document.getElementById("exit-card").style.display = "block";
    if (data.tip) {
      const et = document.getElementById("exit-tip");
      et.style.display = "block";
      et.textContent = data.tip;
    }
    if (data.amap || (data.lat && data.lon)) {
      const al = document.getElementById("amap-link");
      al.style.display = "inline-flex";
      const webUrl = data.amap || `https://uri.amap.com/marker?position=${data.lon},${data.lat}&name=${encodeURIComponent(data.ez || "")}&src=chinametro&callnative=1`;
      al.href = webUrl;
      al.onclick = (e) => {
        e.preventDefault();
        openInAmapApp(data.lat, data.lon, data.ez || data.er || "", webUrl);
      };
    }
  }

  function openInAmapApp(lat, lon, name, fallbackUrl) {
    const ua = navigator.userAgent || "";
    const isIOS = /iPad|iPhone|iPod/i.test(ua);
    const isAndroid = /Android/i.test(ua);
    const qName = encodeURIComponent(name || "");

    let schemeUrl = "";
    if (lat && lon) {
      if (isIOS) {
        schemeUrl = `iosamap://viewMap?sourceApplication=ChinaMetro&poiname=${qName}&lat=${lat}&lon=${lon}&dev=0`;
      } else if (isAndroid) {
        schemeUrl = `androidamap://viewMap?sourceApplication=ChinaMetro&poiname=${qName}&lat=${lat}&lon=${lon}&dev=0`;
      }
    }

    if (schemeUrl) {
      let leftPage = false;
      const onHide = () => { if (document.hidden) leftPage = true; };
      document.addEventListener("visibilitychange", onHide, { once: true });

      window.location.href = schemeUrl;
      setTimeout(() => {
        document.removeEventListener("visibilitychange", onHide);
        if (!leftPage) {
          if (tg && tg.openLink) tg.openLink(fallbackUrl);
          else window.open(fallbackUrl, "_blank");
        }
      }, 750);
    } else {
      if (tg && tg.openLink) tg.openLink(fallbackUrl);
      else window.open(fallbackUrl, "_blank");
    }
  }

  const segContainer = document.getElementById("segments");
  const stationEls = [];
  const segmentBoxes = [];

  (data.g || []).forEach((seg, segIdx) => {
    if (segIdx > 0) {
      const tr = document.createElement("div");
      tr.className = "transfer-link";
      tr.innerHTML = `<div class="transfer-dots"></div><span>Переход на ${seg.l}</span>`;
      segContainer.appendChild(tr);
    }

    const segDiv = document.createElement("div");
    segDiv.className = "segment";
    const lineColor = seg.c || "#38bdf8";

    const badgeTxt = (seg.l || "").replace(/^Линия\s+/i, "");
    const head = document.createElement("div");
    head.className = "seg-header";
    head.innerHTML = `
      <span class="line-badge" style="background:${lineColor};color:${contrastText(lineColor)}">${badgeTxt}</span>
      <span class="seg-dir" id="seg-dir-${segIdx}">${seg.d || ""}</span>
      ${seg.m ? `<span class="seg-meta">${seg.m}</span>` : ""}
      <svg class="seg-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    `;
    head.onclick = () => {
      segDiv.dataset.manualToggle = "1";
      segDiv.classList.toggle("collapsed");
    };
    segDiv.appendChild(head);

    const bodyDiv = document.createElement("div");
    bodyDiv.className = "seg-body";

    const list = seg.s || [];
    const segStartGlobal = stationEls.length;
    const shouldFoldMid = list.length > 7;
    const midRows = [];
    let midExpandEl = null;

    list.forEach((st, idxInSeg) => {
      if (shouldFoldMid && idxInSeg === 2) {
        const hiddenCount = list.length - 4;
        midExpandEl = document.createElement("div");
        midExpandEl.className = "mid-expand";
        midExpandEl.innerHTML = `
          <div class="rail-col">
            <div class="rail-line" style="background:${lineColor};top:0;bottom:0;"></div>
            <div class="mid-expand-dot"></div>
          </div>
          <span>ещё ${hiddenCount} ст. · показать все</span>
        `;
        midExpandEl.onclick = () => {
          midRows.forEach(r => r.classList.remove("mid-hidden"));
          midExpandEl.style.display = "none";
        };
        bodyDiv.appendChild(midExpandEl);
      }

      const el = document.createElement("div");
      const globalIdx = stationEls.length;
      const isMajor = idxInSeg === 0 || idxInSeg === list.length - 1;
      const isTransferStart = segIdx > 0 && idxInSeg === 0;
      const isMidFolded = shouldFoldMid && idxInSeg >= 2 && idxInSeg < list.length - 2;

      stationEls.push({ el, st, seg, segIdx, isTransferStart, midExpandEl, midRows });
      el.className = "station-row" + (isMajor ? " major" : "") + (isMidFolded ? " mid-hidden" : "");
      if (isMidFolded) midRows.push(el);
      el.style.setProperty("--line-color", lineColor);
      el.onclick = () => {
        curIdx = globalIdx;
        if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
        renderProgress();
      };

      const tag = st.x ? `<span class="tag">выход после неё</span>` : "";
      el.innerHTML = `
        <div class="rail-col">
          <div class="rail-line" style="background:${lineColor}"></div>
          <div class="rail-dot"></div>
        </div>
        <div class="st-main">
          <div class="st-ru">${st.r}${tag}</div>
          ${st.e ? `<div class="st-en">${st.e}</div>` : ""}
        </div>
        <div class="st-zh">${st.z || ""}</div>
      `;
      bodyDiv.appendChild(el);
    });

    segDiv.appendChild(bodyDiv);
    segContainer.appendChild(segDiv);
    segmentBoxes.push({
      div: segDiv,
      dirEl: head.querySelector(".seg-dir"),
      origDir: seg.d || "",
      lineName: seg.l || "",
      startGlobal: segStartGlobal,
      endGlobal: stationEls.length - 1,
      count: Math.max(0, list.length - 1),
    });
  });

  // Persist position per route title
  const storageKey = "cm_pos_" + (data.t || "demo").slice(0, 64);
  let curIdx = 0;
  try {
    const savedIdx = parseInt(localStorage.getItem(storageKey) || "0", 10);
    if (!isNaN(savedIdx) && savedIdx >= 0 && savedIdx < stationEls.length) {
      curIdx = savedIdx;
    }
  } catch (e) {}

  function renderProgress() {
    const total = stationEls.length;
    try { localStorage.setItem(storageKey, String(curIdx)); } catch (e) {}

    document.getElementById("reset-btn").classList.toggle("hidden", curIdx === 0);

    stationEls.forEach((item, i) => {
      item.el.classList.toggle("done", i < curIdx);
      item.el.classList.toggle("cur", i === curIdx);
    });

    // Auto-collapse completed segments (unless manually toggled)
    const activeSegIdx = stationEls[curIdx] ? stationEls[curIdx].segIdx : 0;
    segmentBoxes.forEach((box, sIdx) => {
      const isPassed = sIdx < activeSegIdx;
      if (!box.div.dataset.manualToggle) {
        box.div.classList.toggle("collapsed", isPassed);
      }
      box.dirEl.textContent = isPassed
        ? `Пройдено (${box.count} ост.) — нажмите, чтобы раскрыть`
        : box.origDir;
    });

    const pct = total > 1 ? (curIdx / (total - 1)) * 100 : 100;
    document.getElementById("p-fill").style.width = pct + "%";

    const remStops = Math.max(0, total - 1 - curIdx);
    const totalMins = Number(data.tm || 0);
    const remMins = total > 1 && totalMins > 0
      ? Math.max(1, Math.round((remStops / (total - 1)) * totalMins))
      : 0;
    const remEl = document.getElementById("p-rem");
    remEl.innerHTML = remStops === 0
      ? "<strong>Финиш</strong>"
      : `Осталось: <strong>${remStops} ост.</strong>${remMins ? ` (~${remMins} мин)` : ""}`;

    const notice = document.getElementById("notice");
    const curItem = stationEls[curIdx];
    if (curItem) {
      if (curItem.el.classList.contains("mid-hidden") && curItem.midExpandEl) {
        curItem.midRows.forEach(r => r.classList.remove("mid-hidden"));
        curItem.midExpandEl.style.display = "none";
      }
      const curSt = curItem.st;
      document.getElementById("p-label").textContent =
        curIdx === total - 1 ? "Конечная станция" : `Сейчас: ${curSt.r}`;

      if (curIdx === total - 1) {
        notice.style.display = "block";
        notice.textContent = `Выходите на станции ${curSt.r} (${curSt.z})`;
      } else if (curSt.x) {
        notice.style.display = "block";
        notice.textContent = "Приготовьтесь — на следующей станции ваш выход";
      } else if (curItem.isTransferStart) {
        notice.style.display = "block";
        notice.textContent = `Пересадка: следуйте указателям ${curItem.seg.d}`;
      } else {
        notice.style.display = "none";
      }
    }
  }

  function step(delta) {
    const next = curIdx + delta;
    if (next >= 0 && next < stationEls.length) {
      curIdx = next;
      if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
      renderProgress();
      stationEls[curIdx].el.scrollIntoView({ behavior: "smooth", block: "center" });
    }
  }

  function resetProgress() {
    curIdx = 0;
    segmentBoxes.forEach(b => { delete b.div.dataset.manualToggle; });
    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("medium");
    renderProgress();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  let localMode = "end";
  function setLocalMode(mode) {
    localMode = mode;
    document.getElementById("sw-end").classList.toggle("active", mode === "end");
    document.getElementById("sw-cur").classList.toggle("active", mode === "cur");
    updateLocalCard();
  }

  function updateLocalCard() {
    const segs = data.g || [];
    const lastSeg = segs[segs.length - 1] || {};
    const curItem = stationEls[curIdx];
    const activeSeg = (localMode === "cur" && curItem) ? curItem.seg : lastSeg;
    const lc = activeSeg.c || "#111113";
    document.getElementById("local-strip").style.background = lc;
    const pill = document.getElementById("l-line");
    pill.textContent = activeSeg.l || "";
    pill.style.background = lc;
    pill.style.color = contrastText(lc);

    if (localMode === "cur" && curItem) {
      const st = curItem.st;
      document.getElementById("l-zh").textContent = st.z || data.ez || "";
      document.getElementById("l-py").textContent = st.e || "";
      document.getElementById("l-ru").textContent = st.r || "";
    } else {
      document.getElementById("l-zh").textContent = data.ez || "";
      document.getElementById("l-py").textContent = data.ep || "";
      document.getElementById("l-ru").textContent = data.er || "";
    }
  }

  function showLocal(flag) {
    if (flag) updateLocalCard();
    document.getElementById("view-route").style.display = flag ? "none" : "block";
    document.getElementById("view-local").style.display = flag ? "block" : "none";
  }

  function copyZh() {
    const txt = document.getElementById("l-zh").textContent || "";
    const btn = document.getElementById("copy-btn");
    const done = () => {
      btn.textContent = "Скопировано ✓";
      setTimeout(() => { btn.textContent = "Скопировать"; }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(done).catch(() => done());
    } else {
      done();
    }
  }

  renderProgress();
</script>
</body>
</html>
