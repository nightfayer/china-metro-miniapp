<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>ChinaMetro</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0a0a0b;
      --surface: #141416;
      --surface-elevated: #1c1c1f;
      --border: #26262a;
      --rail-done: #2e2e34;
      --text: #fafafa;
      --text-secondary: #8e8e93;
      --text-tertiary: #636366;
      --btn-secondary: #222226;
      --dock-bg: rgba(20, 20, 22, 0.90);
      --warn-bg: rgba(245, 158, 11, 0.14);
      --warn-border: rgba(245, 158, 11, 0.36);
      --warn-text: #fbbf24;
      --ok-bg: rgba(34, 197, 94, 0.14);
      --ok-border: rgba(34, 197, 94, 0.36);
      --ok-text: #4ade80;
      --accent: #2563eb;
      --dot-border: #0a0a0b;
    }
    body.light {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --surface-elevated: #f0f0f3;
      --border: #e5e5ea;
      --rail-done: #d4d4dc;
      --text: #111113;
      --text-secondary: #6e6e73;
      --text-tertiary: #8e8e93;
      --btn-secondary: #e8e8ed;
      --dock-bg: rgba(255, 255, 255, 0.92);
      --warn-bg: #fef3c7;
      --warn-border: #f59e0b;
      --warn-text: #92400e;
      --ok-bg: #dcfce7;
      --ok-border: #22c55e;
      --ok-text: #166534;
      --accent: #1677ff;
      --dot-border: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 10px 14px 136px;
      font-size: 14px;
      line-height: 1.38;
      font-variant-numeric: tabular-nums;
      transition: background .2s ease, color .2s ease;
    }

    /* Sticky Live Focus Bar */
    .now-bar {
      position: sticky;
      top: 8px;
      z-index: 15;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      margin-bottom: 10px;
      border-radius: 14px;
      background: var(--dock-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .24);
      transition: border-color .2s, background .2s;
    }
    .now-bar.warn {
      background: var(--warn-bg);
      border-color: var(--warn-border);
    }
    .now-bar.finish {
      background: var(--ok-bg);
      border-color: var(--ok-border);
    }
    .now-badge {
      min-width: 28px;
      height: 26px;
      padding: 0 8px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: none;
    }
    .now-body { flex: 1; min-width: 0; }
    .now-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .now-bar.warn .now-title { color: var(--warn-text); }
    .now-bar.finish .now-title { color: var(--ok-text); }
    .now-sub {
      font-size: 11.5px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }
    .now-eta {
      text-align: right;
      flex: none;
      padding-left: 4px;
    }
    .now-eta-val {
      font-size: 14px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.1;
    }
    .now-eta-sub {
      font-size: 10.5px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* Ticket-Style Compact Header */
    .summary {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 14px 13px;
      margin-bottom: 10px;
    }
    .summary-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .city-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }
    .top-actions { display: flex; gap: 6px; align-items: center; }
    .icon-btn {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .icon-btn.hidden { display: none; }
    .route-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.24;
      margin-bottom: 10px;
    }
    .kpi-strip {
      display: flex;
      align-items: baseline;
      gap: 14px;
      flex-wrap: wrap;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .kpi-item {
      display: inline-flex;
      align-items: baseline;
      gap: 4px;
    }
    .kpi-big {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .kpi-unit {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
    }
    .kpi-sep {
      width: 1px;
      height: 14px;
      background: var(--border);
      align-self: center;
    }

    .progress-wrap { margin-top: 9px; }
    .progress-track {
      height: 4px;
      background: var(--surface-elevated);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--text);
      border-radius: 99px;
      transition: width .28s cubic-bezier(.22,1,.36,1), background .25s ease;
    }

    /* Transit Timeline */
    .segment {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 13px 9px;
      margin-bottom: 6px;
    }
    .segment.collapsed { padding-bottom: 12px; opacity: 0.72; }
    .segment.collapsed .seg-body { display: none; }
    .seg-header {
      display: flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      user-select: none;
    }
    .segment:not(.collapsed) .seg-header { margin-bottom: 10px; }
    .line-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 24px;
      padding: 0 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 800;
      color: #0a0a0b;
      flex: none;
    }
    .seg-dir {
      flex: 1;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .seg-meta {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-tertiary);
      white-space: nowrap;
      flex: none;
    }
    .seg-chev {
      color: var(--text-tertiary);
      transition: transform .2s ease;
      flex: none;
    }
    .segment.collapsed .seg-chev { transform: rotate(-90deg); }

    .station-row.mid-hidden { display: none; }
    .mid-expand {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 6px 8px 10px 6px;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 12.5px;
      font-weight: 600;
    }
    .mid-expand-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-tertiary);
      margin: 4px auto;
    }

    .station-row {
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 13px;
      padding: 7px 9px 11px 6px;
      border-radius: 11px;
      cursor: pointer;
      transition: background .16s ease, opacity .16s ease;
    }
    .station-row:active { background: var(--surface-elevated); }
    .station-row.cur {
      background: var(--surface-elevated);
      padding-top: 9px;
      padding-bottom: 12px;
    }
    .station-row.done { opacity: 0.42; }
    .station-row.done .st-ru { text-decoration: line-through; }

    /* Continuous Vertical Spine */
    .rail-col {
      position: relative;
      width: 18px;
      display: flex;
      justify-content: center;
      align-self: stretch;
      flex: none;
    }
    .rail-line {
      position: absolute;
      top: 14px;
      bottom: -18px;
      width: 4px;
      border-radius: 2px;
      background: var(--line-color, #888);
      transition: background .2s ease;
    }
    .station-row.done .rail-line {
      background: var(--rail-done) !important;
    }
    .station-row:last-child .rail-line { display: none; }

    .rail-dot {
      position: relative;
      z-index: 2;
      margin-top: 3px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--surface);
      border: 3px solid var(--line-color, #888);
      transition: transform .18s ease, border-color .18s ease;
    }
    .station-row.done .rail-dot {
      border-color: var(--rail-done);
      background: var(--rail-done);
    }
    .station-row.major .rail-dot {
      width: 15px;
      height: 15px;
      margin-top: 2px;
      background: var(--line-color, #888);
      border: 3px solid var(--dot-border);
      box-shadow: 0 0 0 1.5px var(--line-color, #888);
    }
    .station-row.done.major .rail-dot {
      background: var(--rail-done);
      box-shadow: 0 0 0 1.5px var(--rail-done);
    }
    .station-row.cur .rail-dot {
      width: 15px;
      height: 15px;
      margin-top: 2px;
      background: var(--line-color, #888);
      border: 3px solid var(--dot-border);
      box-shadow: 0 0 0 2px var(--line-color, #888);
      animation: pulse-dot 1.8s ease-out infinite;
    }
    @keyframes pulse-dot {
      0%   { box-shadow: 0 0 0 2px var(--line-color, #888), 0 0 0 2px var(--line-color, #888); }
      70%  { box-shadow: 0 0 0 2px var(--line-color, #888), 0 0 0 10px rgba(255, 255, 255, 0); }
      100% { box-shadow: 0 0 0 2px var(--line-color, #888), 0 0 0 2px rgba(255, 255, 255, 0); }
    }

    .st-main { flex: 1; min-width: 0; }
    .st-ru { font-size: 14.5px; font-weight: 600; color: var(--text); line-height: 1.25; }
    .st-en { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
    .st-zh {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-secondary);
      text-align: right;
      white-space: nowrap;
      padding-top: 1px;
      transition: font-size .15s ease, color .15s ease;
    }
    .station-row.cur .st-ru { font-weight: 700; }
    .station-row.cur .st-zh {
      font-size: 17px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: 0.01em;
    }

    .tag {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 6px;
      border-radius: 5px;
      font-size: 10.5px;
      font-weight: 700;
      vertical-align: middle;
      background: var(--warn-bg);
      color: var(--warn-text);
    }

    /* Metro Ceiling Sign Transfer Connector */
    .transfer-sign {
      display: flex;
      align-items: stretch;
      gap: 12px;
      padding: 2px 14px 8px 20px;
    }
    .transfer-rail {
      width: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: none;
    }
    .transfer-dash {
      width: 0;
      flex: 1;
      min-height: 10px;
      border-left: 2px dashed var(--text-tertiary);
    }
    .transfer-icon {
      color: var(--text-secondary);
      margin: 2px 0;
    }
    .transfer-box {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 11px;
      border-radius: 11px;
      background: var(--surface);
      border: 1px dashed var(--border);
    }
    .transfer-zh-badge {
      font-size: 11px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 5px;
      background: var(--surface-elevated);
      color: var(--text);
      flex: none;
    }
    .transfer-text {
      flex: 1;
      min-width: 0;
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.3;
    }
    .transfer-text strong { color: var(--text); font-weight: 700; }

    /* Exit Tip & Amap Card */
    .exit-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      margin-top: 10px;
      transition: border-color .25s ease, box-shadow .25s ease;
    }
    .exit-card.arrived {
      border-color: var(--ok-border);
      box-shadow: 0 0 0 1px var(--ok-border);
    }
    .exit-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .exit-card.arrived .exit-title { color: var(--ok-text); }
    .exit-tip { font-size: 13.5px; color: var(--text); line-height: 1.45; margin-bottom: 12px; }
    .amap-web-link {
      display: block;
      text-align: center;
      margin-top: 9px;
      font-size: 12px;
      color: var(--text-secondary);
      text-decoration: none;
    }
    .amap-btn {
      width: 100%;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface-elevated);
      color: var(--text);
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: background .2s ease, color .2s ease, border-color .2s ease;
    }
    .exit-card.arrived .amap-btn {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    /* Floating Bottom Dock */
    .dock {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: max(12px, env(safe-area-inset-bottom));
      background: var(--dock-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 8px;
      display: flex;
      gap: 8px;
      z-index: 20;
      box-shadow: 0 12px 32px rgba(0, 0, 0, .35);
    }
    .dock button {
      border: 0;
      border-radius: 11px;
      height: 44px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform .1s ease, opacity .15s, background .2s ease;
    }
    .dock button:active { transform: scale(0.97); }
    .btn-prev { width: 44px; flex: none; background: var(--btn-secondary); color: var(--text); }
    .btn-next {
      flex: 1.7;
      min-width: 0;
      padding: 0 12px;
      background: var(--text);
      color: var(--bg);
      font-weight: 700;
    }
    .btn-next.finish-mode {
      background: #16a34a;
      color: #ffffff;
    }
    .btn-next-txt {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-local { flex: 0.95; background: var(--btn-secondary); color: var(--text); padding: 0 10px; }

    /* Show-to-Local Fullscreen Card */
    .local-view {
      display: none;
      background: #ffffff;
      color: #111113;
      border-radius: 20px;
      overflow: hidden;
      padding: 0 18px 22px;
      text-align: center;
      border: 1px solid #e5e5ea;
      box-shadow: 0 16px 40px rgba(0, 0, 0, .25);
    }
    .local-strip { height: 10px; margin: 0 -18px 18px; background: #111113; }
    .local-line-pill {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 14px;
    }
    .seg-switch {
      display: flex;
      background: #f0f0f3;
      border-radius: 10px;
      padding: 3px;
      margin-bottom: 22px;
    }
    .seg-switch button {
      flex: 1;
      height: 34px;
      border: 0;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      background: transparent;
      color: #6e6e73;
    }
    .seg-switch button.active {
      background: #ffffff;
      color: #111113;
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
    }
    .local-ask { font-size: 16px; color: #6e6e73; margin-bottom: 14px; }
    .local-zh { font-size: 44px; font-weight: 800; color: #dc2626; line-height: 1.15; letter-spacing: 0.02em; margin: 10px 0; }
    .local-div { height: 1px; background: #e5e5ea; margin: 20px 12px; }
    .local-py { font-size: 15px; color: #6e6e73; }
    .local-ru { font-size: 17.5px; font-weight: 700; color: #111113; margin: 6px 0 22px; }
    .local-actions { display: flex; gap: 8px; }
    .local-copy {
      flex: 1;
      height: 46px;
      border: 1px solid #d1d1d6;
      border-radius: 12px;
      background: #f5f5f7;
      color: #111113;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .local-back {
      flex: 1.2;
      height: 46px;
      border: 0;
      border-radius: 12px;
      background: #111113;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="view-route">
  <div class="now-bar" id="now-bar">
    <span class="now-badge" id="now-badge">—</span>
    <div class="now-body">
      <div class="now-title" id="now-title">Загрузка маршрута...</div>
      <div class="now-sub" id="now-sub">Тапайте на станции по ходу поездки</div>
    </div>
    <div class="now-eta">
      <div class="now-eta-val" id="now-eta-val">—</div>
      <div class="now-eta-sub" id="now-eta-sub"></div>
    </div>
  </div>

  <div class="summary">
    <div class="summary-top">
      <div class="city-label" id="h-city">Маршрут</div>
      <div class="top-actions">
        <button class="icon-btn hidden" id="reset-btn" onclick="resetProgress()" aria-label="Сбросить прогресс" title="Начать заново">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        </button>
        <button class="icon-btn" id="theme-btn" onclick="toggleTheme()" aria-label="Сменить тему"></button>
      </div>
    </div>
    <div class="route-title" id="h-title">Загрузка...</div>
    <div class="kpi-strip" id="h-kpi"></div>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="p-fill"></div></div>
    </div>
  </div>

  <div id="segments"></div>

  <div class="exit-card" id="exit-card" style="display:none;">
    <div class="exit-title" id="exit-title">Выход из метро и карта</div>
    <div class="exit-tip" id="exit-tip" style="display:none;"></div>
    <a class="amap-btn" id="amap-link" href="#" style="display:none;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg>
      <span>Открыть выход в приложении Amap</span>
    </a>
    <a class="amap-web-link" id="amap-web-link" href="#" target="_blank" style="display:none;">Открыть веб-карту (если Amap не установлен)</a>
  </div>

  <div class="dock">
    <button class="btn-prev" onclick="step(-1)" aria-label="Предыдущая станция">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button class="btn-next" id="btn-next" onclick="stepNextAction()">
      <span class="btn-next-txt" id="btn-next-txt">Следующая</span>
      <svg id="btn-next-ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    <button class="btn-local" onclick="showLocal(true)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span>Местному</span>
    </button>
  </div>
</div>

<div class="local-view" id="view-local">
  <div class="local-strip" id="local-strip"></div>
  <div class="seg-switch">
    <button id="sw-end" class="active" onclick="setLocalMode('end')">Конечная</button>
    <button id="sw-cur" onclick="setLocalMode('cur')">Текущая станция</button>
  </div>
  <div class="local-line-pill" id="l-line"></div>
  <div class="local-ask">请问，怎么去这个地铁站？</div>
  <div class="local-zh" id="l-zh"></div>
  <div class="local-div"></div>
  <div class="local-py" id="l-py"></div>
  <div class="local-ru" id="l-ru"></div>
  <div class="local-actions">
    <button class="local-copy" id="copy-btn" onclick="copyZh()">Скопировать</button>
    <button class="local-back" onclick="showLocal(false)">К маршруту</button>
  </div>
</div>

<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  const SUN_SVG = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
  const MOON_SVG = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';

  function applyTheme() {
    const saved = localStorage.getItem("cm_theme");
    const isLight = saved ? saved === "light" : (tg && tg.colorScheme === "light");
    document.body.classList.toggle("light", !!isLight);
    document.getElementById("theme-btn").innerHTML = isLight ? MOON_SVG : SUN_SVG;
  }
  function toggleTheme() {
    const isLight = !document.body.classList.contains("light");
    document.body.classList.toggle("light", isLight);
    localStorage.setItem("cm_theme", isLight ? "light" : "dark");
    document.getElementById("theme-btn").innerHTML = isLight ? MOON_SVG : SUN_SVG;
  }
  applyTheme();

  function decodeBase64UrlJson(b64u) {
    const b64 = b64u.replace(/-/g, '+').replace(/_/g, '/');
    const pad = b64.length % 4 ? '='.repeat(4 - (b64.length % 4)) : '';
    const bin = atob(b64 + pad);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return JSON.parse(new TextDecoder("utf-8").decode(bytes));
  }

  function contrastText(hex) {
    const h = (hex || "#888888").replace("#", "");
    if (h.length !== 6) return "#0a0a0b";
    const r = parseInt(h.slice(0, 2), 16);
    const g = parseInt(h.slice(2, 4), 16);
    const b = parseInt(h.slice(4, 6), 16);
    return (0.299 * r + 0.587 * g + 0.114 * b) > 152 ? "#0a0a0b" : "#ffffff";
  }

  function shortLineLabel(name) {
    return (name || "").replace(/^Линия\s+/i, "");
  }

  const demoData = {
    c: "Шанхай",
    t: "Аэропорт Пудун → Вайтань",
    m: "58 мин · 7 ¥ (~86 ₽) · без пересадок",
    tm: 58,
    ez: "南京东路",
    ep: "Nanjing East Road",
    er: "Восточная Нанкинская улица (Вайтань)",
    tip: "Выход 2 или 7 — до набережной Вайтань (The Bund) ~7 минут пешком.",
    lat: 31.2381,
    lon: 121.4846,
    amap: "https://uri.amap.com/marker?position=121.4846,31.2381&name=%E5%8D%97%E4%BA%AC%E4%B8%9C%E8%B7%AF&src=chinametro&callnative=1",
    g: [
      {
        l: "Линия 2",
        c: "#8FC31F",
        d: "往 国家会展中心",
        m: "3 ост.",
        s: [
          { r: "Аэропорт Пудун", e: "Pudong Airport", z: "浦东1号2号航站楼" },
          { r: "Луцзяцзуй", e: "Lujiazui", z: "陆家嘴", x: 1 },
          { r: "Восточная Нанкинская", e: "East Nanjing Rd", z: "南京东路" }
        ]
      }
    ]
  };

  let data = demoData;
  try {
    const hash = window.location.hash || "";
    const match = hash.match(/d=([^&]+)/);
    if (match && match[1]) data = decodeBase64UrlJson(match[1]);
  } catch (e) {
    console.error("Decode error:", e);
  }

  document.getElementById("h-city").textContent = data.c || "ChinaMetro";
  document.getElementById("h-title").textContent = data.t || "Маршрут";

  // Ticket-style KPI strip from data.m ("58 мин · 7 ¥ (~86 ₽) · без пересадок")
  const rawParts = (data.m || "").split("·").map(s => s.trim()).filter(Boolean);
  const kpiHtml = rawParts.map((part, idx) => {
    const sep = idx > 0 ? '<span class="kpi-sep"></span>' : '';
    const mTime = part.match(/^(\d+)\s*(мин.*)$/i);
    if (mTime) {
      return `${sep}<span class="kpi-item"><span class="kpi-big">${mTime[1]}</span><span class="kpi-unit">${mTime[2]}</span></span>`;
    }
    const mFare = part.match(/^(\d+\s*¥)\s*(\(.*\))?$/);
    if (mFare) {
      return `${sep}<span class="kpi-item"><span class="kpi-big">${mFare[1]}</span>${mFare[2] ? `<span class="kpi-unit">${mFare[2]}</span>` : ''}</span>`;
    }
    return `${sep}<span class="kpi-item"><span class="kpi-unit">${part}</span></span>`;
  }).join("");
  document.getElementById("h-kpi").innerHTML = kpiHtml;

  // Exit tip & Amap button
  if (data.tip || data.amap) {
    document.getElementById("exit-card").style.display = "block";
    if (data.tip) {
      const et = document.getElementById("exit-tip");
      et.style.display = "block";
      et.textContent = data.tip;
    }
    if (data.amap || (data.lat && data.lon)) {
      const al = document.getElementById("amap-link");
      const wl = document.getElementById("amap-web-link");
      const webUrl = data.amap || `https://uri.amap.com/marker?position=${data.lon},${data.lat}&name=${encodeURIComponent(data.ez || "")}&src=chinametro&callnative=1`;
      const bridgeUrl = buildAmapBridgeUrl(data.lat, data.lon, data.ez || "", data.er || "", webUrl);
      const nativeUrl = buildNativeAmapUrl(data.lat, data.lon, data.ez || data.er || "");

      const inTelegram = !!(tg && tg.platform && tg.platform !== "unknown" && typeof tg.openLink === "function");

      function openExternal(url) {
        if (inTelegram) {
          try {
            tg.openLink(url);
            return;
          } catch (_) {}
        }
        const win = window.open(url, "_blank", "noopener");
        if (!win) window.location.href = url;
      }

      al.style.display = "inline-flex";
      al.href = inTelegram ? bridgeUrl : (nativeUrl || bridgeUrl);
      al.onclick = (e) => {
        try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred("light"); } catch (_) {}
        if (inTelegram) {
          e.preventDefault();
          openExternal(bridgeUrl);
        } else if (!nativeUrl) {
          e.preventDefault();
          openExternal(bridgeUrl);
        }
      };

      wl.style.display = "block";
      wl.href = webUrl;
      wl.onclick = (e) => {
        if (inTelegram) {
          e.preventDefault();
          openExternal(webUrl);
        }
      };
    }
  }

  function buildAmapBridgeUrl(lat, lon, nameZh, nameRu, fallbackUrl) {
    if (!lat || !lon) return fallbackUrl;
    try {
      const u = new URL("amap.html", window.location.href);
      u.searchParams.set("lat", String(lat));
      u.searchParams.set("lon", String(lon));
      if (nameZh) u.searchParams.set("name", nameZh);
      if (nameRu) u.searchParams.set("ru", nameRu);
      return u.toString();
    } catch (_) {
      return fallbackUrl;
    }
  }

  function buildNativeAmapUrl(lat, lon, name) {
    if (!lat || !lon) return "";
    const ua = navigator.userAgent || "";
    const isIOS = /iPad|iPhone|iPod/i.test(ua);
    const isAndroid = /Android/i.test(ua);
    const qName = encodeURIComponent(name || "");
    if (isIOS) {
      return `iosamap://viewMap?sourceApplication=ChinaMetro&poiname=${qName}&lat=${lat}&lon=${lon}&dev=0`;
    }
    if (isAndroid) {
      return `intent://viewMap?sourceApplication=ChinaMetro&poiname=${qName}&lat=${lat}&lon=${lon}&dev=0#Intent;scheme=androidamap;package=com.autonavi.minimap;end`;
    }
    return "";
  }

  const segContainer = document.getElementById("segments");
  const stationEls = [];
  const segmentBoxes = [];

  (data.g || []).forEach((seg, segIdx) => {
    const lineColor = seg.c || "#2563eb";
    const badgeTxt = shortLineLabel(seg.l || "");

    if (segIdx > 0) {
      const tr = document.createElement("div");
      tr.className = "transfer-sign";
      tr.innerHTML = `
        <div class="transfer-rail">
          <div class="transfer-dash"></div>
          <svg class="transfer-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
          <div class="transfer-dash"></div>
        </div>
        <div class="transfer-box">
          <span class="transfer-zh-badge">换乘</span>
          <span class="line-badge" style="background:${lineColor};color:${contrastText(lineColor)};height:22px;min-width:24px;font-size:11px;">${badgeTxt}</span>
          <div class="transfer-text">
            <strong>Пересадка на ${seg.l}</strong>${seg.d ? `<br>${seg.d}` : ""}
          </div>
        </div>
      `;
      segContainer.appendChild(tr);
    }

    const segDiv = document.createElement("div");
    segDiv.className = "segment";

    const head = document.createElement("div");
    head.className = "seg-header";
    head.innerHTML = `
      <span class="line-badge" style="background:${lineColor};color:${contrastText(lineColor)}">${badgeTxt}</span>
      <span class="seg-dir" id="seg-dir-${segIdx}">${seg.d || ""}</span>
      ${seg.m ? `<span class="seg-meta">${seg.m}</span>` : ""}
      <svg class="seg-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    `;
    head.onclick = () => {
      segDiv.dataset.manualToggle = "1";
      segDiv.classList.toggle("collapsed");
    };
    segDiv.appendChild(head);

    const bodyDiv = document.createElement("div");
    bodyDiv.className = "seg-body";

    const list = seg.s || [];
    const segStartGlobal = stationEls.length;
    const shouldFoldMid = list.length > 7;
    const midRows = [];
    let midExpandEl = null;

    list.forEach((st, idxInSeg) => {
      if (shouldFoldMid && idxInSeg === 2) {
        const hiddenCount = list.length - 4;
        midExpandEl = document.createElement("div");
        midExpandEl.className = "mid-expand";
        midExpandEl.innerHTML = `
          <div class="rail-col">
            <div class="rail-line" style="background:${lineColor};top:0;bottom:0;"></div>
            <div class="mid-expand-dot"></div>
          </div>
          <span>ещё ${hiddenCount} ст. · показать все</span>
        `;
        midExpandEl.onclick = () => {
          midRows.forEach(r => r.classList.remove("mid-hidden"));
          midExpandEl.style.display = "none";
        };
        bodyDiv.appendChild(midExpandEl);
      }

      const el = document.createElement("div");
      const globalIdx = stationEls.length;
      const isMajor = idxInSeg === 0 || idxInSeg === list.length - 1;
      const isTransferStart = segIdx > 0 && idxInSeg === 0;
      const isTransferEnd = segIdx < (data.g || []).length - 1 && idxInSeg === list.length - 1;
      const isMidFolded = shouldFoldMid && idxInSeg >= 2 && idxInSeg < list.length - 2;

      stationEls.push({ el, st, seg, segIdx, idxInSeg, segLen: list.length, isTransferStart, isTransferEnd, midExpandEl, midRows });
      el.className = "station-row" + (isMajor ? " major" : "") + (isMidFolded ? " mid-hidden" : "");
      if (isMidFolded) midRows.push(el);
      el.style.setProperty("--line-color", lineColor);
      el.onclick = () => {
        curIdx = globalIdx;
        try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred("light"); } catch (_) {}
        renderProgress(true);
      };

      const tag = st.x ? `<span class="tag">выход на след.</span>` : "";
      el.innerHTML = `
        <div class="rail-col">
          <div class="rail-line" style="background:${lineColor}"></div>
          <div class="rail-dot"></div>
        </div>
        <div class="st-main">
          <div class="st-ru">${st.r}${tag}</div>
          ${st.e ? `<div class="st-en">${st.e}</div>` : ""}
        </div>
        <div class="st-zh">${st.z || ""}</div>
      `;
      bodyDiv.appendChild(el);
    });

    segDiv.appendChild(bodyDiv);
    segContainer.appendChild(segDiv);
    segmentBoxes.push({
      div: segDiv,
      dirEl: head.querySelector(".seg-dir"),
      origDir: seg.d || "",
      lineName: seg.l || "",
      startGlobal: segStartGlobal,
      endGlobal: stationEls.length - 1,
      count: Math.max(0, list.length - 1),
    });
  });

  // Persist position per route title
  const storageKey = "cm_pos_" + (data.t || "demo").slice(0, 64);
  let curIdx = 0;
  try {
    const savedIdx = parseInt(localStorage.getItem(storageKey) || "0", 10);
    if (!isNaN(savedIdx) && savedIdx >= 0 && savedIdx < stationEls.length) {
      curIdx = savedIdx;
    }
  } catch (e) {}

  function renderProgress(fromUserTap = false) {
    const total = stationEls.length;
    try { localStorage.setItem(storageKey, String(curIdx)); } catch (e) {}

    document.getElementById("reset-btn").classList.toggle("hidden", curIdx === 0);

    stationEls.forEach((item, i) => {
      item.el.classList.toggle("done", i < curIdx);
      item.el.classList.toggle("cur", i === curIdx);
    });

    const curItem = stationEls[curIdx];
    const activeSegIdx = curItem ? curItem.segIdx : 0;
    const isFinished = curIdx === total - 1;

    // Auto-collapse completed segments
    segmentBoxes.forEach((box, sIdx) => {
      const isPassed = sIdx < activeSegIdx;
      if (!box.div.dataset.manualToggle) {
        box.div.classList.toggle("collapsed", isPassed);
      }
      box.dirEl.textContent = isPassed
        ? `Пройдено (${box.count} ост.) · нажмите, чтобы раскрыть`
        : box.origDir;
    });

    // Progress bar tinted with active line color
    const pct = total > 1 ? (curIdx / (total - 1)) * 100 : 100;
    const fill = document.getElementById("p-fill");
    fill.style.width = pct + "%";
    fill.style.background = isFinished ? "#16a34a" : (curItem ? (curItem.seg.c || "#2563eb") : "var(--text)");

    // Remaining stops & ETA
    const remStops = Math.max(0, total - 1 - curIdx);
    const totalMins = Number(data.tm || 0);
    const remMins = total > 1 && totalMins > 0
      ? Math.max(1, Math.round((remStops / (total - 1)) * totalMins))
      : 0;

    // Sticky Now-Bar & Smart Dock Button
    const nowBar = document.getElementById("now-bar");
    const nowBadge = document.getElementById("now-badge");
    const nowTitle = document.getElementById("now-title");
    const nowSub = document.getElementById("now-sub");
    const nowEtaVal = document.getElementById("now-eta-val");
    const nowEtaSub = document.getElementById("now-eta-sub");
    const exitCard = document.getElementById("exit-card");
    const exitTitle = document.getElementById("exit-title");
    const nextBtn = document.getElementById("btn-next");
    const nextTxt = document.getElementById("btn-next-txt");
    const nextIco = document.getElementById("btn-next-ico");

    exitCard.classList.toggle("arrived", isFinished);
    exitTitle.textContent = isFinished ? "Вы на месте — выход и карта" : "Выход из метро и карта";

    if (curItem) {
      if (curItem.el.classList.contains("mid-hidden") && curItem.midExpandEl) {
        curItem.midRows.forEach(r => r.classList.remove("mid-hidden"));
        curItem.midExpandEl.style.display = "none";
      }

      const lc = curItem.seg.c || "#2563eb";
      nowBadge.textContent = shortLineLabel(curItem.seg.l || "");
      nowBadge.style.background = lc;
      nowBadge.style.color = contrastText(lc);

      const segStopsLeft = curItem.segLen - 1 - curItem.idxInSeg;
      const hasNextSeg = curItem.segIdx < (data.g || []).length - 1;
      const nextSeg = hasNextSeg ? (data.g || [])[curItem.segIdx + 1] : null;
      const curSt = curItem.st;

      nowBar.classList.remove("warn", "finish");

      if (isFinished) {
        nowBar.classList.add("finish");
        nowTitle.textContent = `Выходите · ${curSt.z || curSt.r}`;
        nowSub.textContent = curSt.r;
        nowEtaVal.textContent = "Финиш";
        nowEtaSub.textContent = "прибыли";
        if (fromUserTap) {
          try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success"); } catch (_) {}
        }
      } else if (curSt.x || (segStopsLeft === 1 && !hasNextSeg)) {
        nowBar.classList.add("warn");
        nowTitle.textContent = "Готовьтесь к выходу — следующая ваша!";
        nowSub.textContent = `Сейчас: ${curSt.r} (${curSt.z || ""})`;
        nowEtaVal.textContent = remMins ? `~${remMins} мин` : "1 ст.";
        nowEtaSub.textContent = "1 ост.";
        if (fromUserTap) {
          try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("warning"); } catch (_) {}
        }
      } else if (curItem.isTransferEnd && nextSeg) {
        nowBar.classList.add("warn");
        nowTitle.textContent = `Пересадка на ${nextSeg.l}`;
        nowSub.textContent = nextSeg.d ? `Ищите указатель: 换乘 · ${nextSeg.d}` : `Переход на ${nextSeg.l}`;
        nowEtaVal.textContent = remMins ? `~${remMins} мин` : `${remStops} ст.`;
        nowEtaSub.textContent = `ост. ${remStops}`;
        if (fromUserTap) {
          try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("warning"); } catch (_) {}
        }
      } else if (segStopsLeft === 1 && hasNextSeg && nextSeg) {
        nowBar.classList.add("warn");
        nowTitle.textContent = `Через 1 ст. пересадка на ${nextSeg.l}`;
        nowSub.textContent = `Сейчас: ${curSt.r} (${curSt.z || ""})`;
        nowEtaVal.textContent = remMins ? `~${remMins} мин` : `${remStops} ст.`;
        nowEtaSub.textContent = `ост. ${remStops}`;
        if (fromUserTap) {
          try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("warning"); } catch (_) {}
        }
      } else {
        nowTitle.textContent = hasNextSeg
          ? `Едем до пересадки (${segStopsLeft} ост.)`
          : `Едем до выхода (${remStops} ост.)`;
        nowSub.textContent = `Сейчас: ${curSt.r}${curSt.z ? ` · ${curSt.z}` : ""}`;
        nowEtaVal.textContent = remMins ? `~${remMins} мин` : `${remStops} ст.`;
        nowEtaSub.textContent = `ост. ${remStops}`;
      }

      // Smart bottom CTA button
      if (isFinished) {
        nextBtn.classList.add("finish-mode");
        nextTxt.textContent = "Выход и карта Amap";
        nextIco.style.display = "none";
      } else {
        nextBtn.classList.remove("finish-mode");
        nextIco.style.display = "inline";
        const nextItem = stationEls[curIdx + 1];
        if (nextItem && nextItem.isTransferStart) {
          nextTxt.textContent = `Пересел на ${nextItem.seg.l}`;
        } else if (curIdx + 1 === total - 1) {
          nextTxt.textContent = `Выход · ${nextItem.st.z || nextItem.st.r}`;
        } else if (nextItem) {
          nextTxt.textContent = `Далее · ${nextItem.st.z || nextItem.st.r}`;
        } else {
          nextTxt.textContent = "Следующая";
        }
      }
    }
  }

  function stepNextAction() {
    if (curIdx >= stationEls.length - 1) {
      const ec = document.getElementById("exit-card");
      if (ec && ec.style.display !== "none") {
        ec.scrollIntoView({ behavior: "smooth", block: "center" });
      }
      return;
    }
    step(1);
  }

  function step(delta) {
    const next = curIdx + delta;
    if (next >= 0 && next < stationEls.length) {
      curIdx = next;
      try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred("light"); } catch (_) {}
      renderProgress(true);
      stationEls[curIdx].el.scrollIntoView({ behavior: "smooth", block: "center" });
    }
  }

  function resetProgress() {
    curIdx = 0;
    segmentBoxes.forEach(b => { delete b.div.dataset.manualToggle; });
    try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred("medium"); } catch (_) {}
    renderProgress(false);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  let localMode = "end";
  function setLocalMode(mode) {
    localMode = mode;
    document.getElementById("sw-end").classList.toggle("active", mode === "end");
    document.getElementById("sw-cur").classList.toggle("active", mode === "cur");
    updateLocalCard();
  }

  function updateLocalCard() {
    const segs = data.g || [];
    const lastSeg = segs[segs.length - 1] || {};
    const curItem = stationEls[curIdx];
    const activeSeg = (localMode === "cur" && curItem) ? curItem.seg : lastSeg;
    const lc = activeSeg.c || "#111113";
    document.getElementById("local-strip").style.background = lc;
    const pill = document.getElementById("l-line");
    pill.textContent = activeSeg.l || "";
    pill.style.background = lc;
    pill.style.color = contrastText(lc);

    if (localMode === "cur" && curItem) {
      const st = curItem.st;
      document.getElementById("l-zh").textContent = st.z || data.ez || "";
      document.getElementById("l-py").textContent = st.e || "";
      document.getElementById("l-ru").textContent = st.r || "";
    } else {
      document.getElementById("l-zh").textContent = data.ez || "";
      document.getElementById("l-py").textContent = data.ep || "";
      document.getElementById("l-ru").textContent = data.er || "";
    }
  }

  function showLocal(flag) {
    if (flag) updateLocalCard();
    document.getElementById("view-route").style.display = flag ? "none" : "block";
    document.getElementById("view-local").style.display = flag ? "block" : "none";
  }

  function copyZh() {
    const txt = document.getElementById("l-zh").textContent || "";
    const btn = document.getElementById("copy-btn");
    const done = () => {
      btn.textContent = "Скопировано ✓";
      setTimeout(() => { btn.textContent = "Скопировать"; }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(done).catch(() => done());
    } else {
      done();
    }
  }

  renderProgress(false);
</script>
</body>
</html>
